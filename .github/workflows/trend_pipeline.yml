name: TrendRadar Pipeline

on:
  schedule:
    # 每 10 分鐘觸發（GHA 最短 5 分鐘；趨勢去重所以不會重複呼叫 Gemini）
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 手動觸發

# 防止上一輪還沒跑完又起一輪
concurrency:
  group: trend_pipeline
  cancel-in-progress: false

jobs:
  trend-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # 為了 commit state 回 repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          mkdir -p ~/.polymarket
          cat > ~/.polymarket/.env <<EOF
          WALLET_PRIVATE_KEY=${{ secrets.WALLET_PRIVATE_KEY }}
          POLY_API_KEY=${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET=${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE=${{ secrets.POLY_API_PASSPHRASE }}
          POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
          TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_MODE=false
          MAX_BET_USDC=10
          MAX_TOTAL_OPEN_USDC=100
          DAILY_LOSS_LIMIT_USDC=10
          INITIAL_CAPITAL_USDC=100
          TREND_MIN_HEAT=40
          TREND_MIN_CONFIDENCE=0.35
          TREND_MIN_HOURS_LEFT=48
          TREND_EVALUATOR_MODEL=claude-haiku-4-5
          TREND_GEMINI_MODEL=gemini-2.5-flash-lite
          EOF
          # LLM 評估層：免費走 Gemini（Secrets 加 GEMINI_API_KEY，AI Studio 免費領）；
          # 之後想升級品質改加 ANTHROPIC_API_KEY（計費，auto 模式 Gemini 優先）。
          # 兩把 key 都沒設時程式優雅降級成 0 單（不崩潰）。

      - name: Run trend pipeline
        run: python -m scripts.run_trend_pipeline

      - name: Commit trend state back to repo
        # 只提交策略 B 自己的狀態檔，先 rebase 再 push，避免與每 5 分鐘的鯨魚
        # workflow 互撞（contents:write 同分支會 race）。
        # ⚠️ 逐檔 add：0 單時 pending/executed 等檔不存在，多檔一次 add 會因
        #    pathspec 不存在而整批失敗 → 之前 state 一直沒存回（已修）。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in trend_state.json pending_orders_trend.jsonl rejected_trend.jsonl \
                   processed_trend.json executed_orders_trend.jsonl executed_trend_hashes.json; do
            git add "data/$f" 2>/dev/null || true
          done
          if git diff --staged --quiet; then
            echo "no trend state changes"
          else
            git commit -m "data: trend pipeline state @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=false
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && { pushed=true; break; }
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
            # 同 pipeline.yml 的修復：3 次全失敗要讓 step 真的失敗，不能靜默放行
            # （2026-07-03~07-10 monitor_state.json/signals.jsonl 就是這樣悄悄凍結 6.6 天）
            if [ "$pushed" = false ]; then
              echo "::error::push 重試 3 次全部失敗，state 未能寫回 repo"
              exit 1
            fi
          fi
