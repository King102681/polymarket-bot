name: Whale Copy Pipeline

on:
  schedule:
    # 每 5 分鐘跑一次（加速捕捉鯨魚訊號，避免市場 30 分鐘內移動到 0.99+）
    # GHA cron 最短間隔 5 分鐘，公開 repo 不限 Actions 分鐘
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 手動觸發

# 用 concurrency 防止上一輪還沒跑完又起一輪
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 為了 commit state 回 repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          mkdir -p ~/.polymarket
          cat > ~/.polymarket/.env <<EOF
          WALLET_PRIVATE_KEY=${{ secrets.WALLET_PRIVATE_KEY }}
          POLY_API_KEY=${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET=${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE=${{ secrets.POLY_API_PASSPHRASE }}
          POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
          TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}
          LIVE_MODE=false
          MAX_BET_USDC=10
          MAX_TOTAL_OPEN_USDC=100
          DAILY_LOSS_LIMIT_USDC=10
          WHALE_FOLLOW_RATIO=0.001
          INITIAL_CAPITAL_USDC=100
          EOF

      - name: Run pipeline
        run: python -m scripts.run_pipeline

      - name: Commit state back to repo
        # 把 monitor_state.json / signals.jsonl / pending_orders.jsonl / processed_signal_hashes.json
        # 等狀態檔提交回 repo，這樣下次 cron 跑時能讀到上次的進度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "data: pipeline state @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=false
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && { pushed=true; break; }
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
            # ⚠️ 2026-07-03~07-10 踩過的坑：迴圈3次全失敗但沒有 exit 1，
            # 整個 step 靜默回報成功——monitor_state.json/signals.jsonl 因此
            # 卡了 6.6 天沒真正更新，pipeline 表面一直綠燈，實際上完全沒在
            # 抓新鯨魚訊號。這裡改成明確失敗，讓下次再發生時 GHA 會直接標紅。
            if [ "$pushed" = false ]; then
              echo "::error::push 重試 3 次全部失敗，state 未能寫回 repo"
              exit 1
            fi
          fi
